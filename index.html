<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#f8f1e5">
<title>像素猫 · 小方糕</title>
<style>
  * { margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; background: #f8f1e5; }
  body { font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif; user-select: none; -webkit-user-select: none; }
  #cv { position: fixed; inset: 0; width: 100%; height: 100%; touch-action: none; display: block; }
  #title { position: fixed; top: calc(16px + env(safe-area-inset-top)); left: 0; right: 0; text-align: center; pointer-events: none; }
  #title b { display: block; font-size: 16px; color: #8a6f56; letter-spacing: 6px; font-weight: 600; }
  #title span { display: block; margin-top: 5px; font-size: 11px; color: #c2a084; letter-spacing: 3px; }
  #guide { position: fixed; left: 0; right: 0; bottom: calc(18px + env(safe-area-inset-bottom)); text-align: center; pointer-events: none; }
  #guide div { font-size: 12px; color: #c9ab8f; letter-spacing: 2px; line-height: 2.1; }
  #hint { position: fixed; left: 50%; bottom: calc(96px + env(safe-area-inset-bottom)); transform: translateX(-50%); font-size: 15px; color: #c2a084; letter-spacing: 4px; opacity: 0.9; transition: opacity 1s; pointer-events: none; white-space: nowrap; }
  #shareBtn { position: fixed; top: calc(16px + env(safe-area-inset-top)); right: 16px; font-size: 12px; color: #a0886a; border: 1px solid #d8c6ac; background: rgba(255,253,248,0.7); padding: 5px 14px; border-radius: 999px; cursor: pointer; transition: background .2s, color .2s; user-select: none; -webkit-tap-highlight-color: transparent; }
  #shareBtn:active { background: #8a6f56; color: #fff; }
  #grrBubble { position: fixed; z-index: 5; opacity: 0; pointer-events: none; transition: opacity .25s; image-rendering: pixelated; image-rendering: crisp-edges; }
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="title"><b>小方糕</b><span>一只可以摸的像素猫</span></div>
<div id="hint">摸 摸 它 的 头</div>
<div id="guide">
  <div>顺着毛摸 · 它会舒服</div>
  <div>逆着摸 · 它会不耐烦</div>
  <div>一直不理它 · 它会睡着</div>
</div>
<div id="shareBtn">分享</div>
<canvas id="grrBubble" width="40" height="30"></canvas>
<script src="parts-data.js"></script>
<script src="parts.js"></script>
<script>window.STUDIO_CONFIG = { siteId: 'pixel-cat' };</script>
<script src="studio-track.js"></script>
<script>
(function () {
  var SPEC = null;
  for (var i = 0; i < CAT.VARIANTS.length; i++) if (CAT.VARIANTS[i].name === '小方糕') SPEC = CAT.VARIANTS[i];
  var PAL = Object.assign({}, CAT.DEF, SPEC.palette);
  var cv = document.getElementById('cv');
  var ctx = cv.getContext('2d');
  var hint = document.getElementById('hint');
  var cw, ch, dpr, S, ox, oy;

  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }

  var SPRITES = {
    heart: { rows: ['.XX.XX.', 'XXXXXXX', 'XXXXXXX', '.XXXXX.', '..XXX..', '...X...'], color: '#e8635a', glint: [1, 1] },
    anger: { rows: ['..X...X..', '.XXX.XXX.', '..X...X..', '.........', '..X...X..', '.XXX.XXX.', '..X...X..'], color: '#e04b3f' },
    z: { rows: ['XXXXX', '...X.', '..X..', '.X...', 'XXXXX'], color: '#8a92a8' },
    bang: { rows: ['XX', 'XX', 'XX', '..', 'XX'], color: '#5a4a3a' },
    note: { rows: ['..XXX', '..X..', '..X..', '..X..', '.X...', 'XX...', 'XX...'], color: '#d98f70' },
    dot: { rows: ['X.....X', '.X...X.', '..X.X..', '...X...', '..X.X..', '.X...X.', 'X.....X'], color: '#7eb8da' },
    dot2: { rows: ['..X.X..', '.X...X.', 'X.....X', '...X...', 'X.....X', '.X...X.', '..X.X..'], color: '#d4a0c0' },
    dust: { rows: ['..X..', '.XXX.', 'XXXXX', '.XXX.', '..X..'], color: '#c9ab8f' }
  };

  var E = 0, annoy = 0, prevE = 0;
  var holding = false, ptrId = null, fx = 40, fy = 8;
  var lastPX = 0, lastPY = 0, gAcc = 0, dyAcc = 0;
  var pose = { ear: 0, squint: 0, sway: 0, lean: 0 };
  var blinkAt = 2600, blinkUntil = 0, twitchAt = 7000, twitchUntil = 0;
  var microNextT = 0, hbUntil = 0, hbDir = 0, purrBumpUntil = 0;
  var angry = false, angryUntil = 0;
  var goodT = 0, sighed = false;
  var asleep = false, startleUntil = 0, lastTouchT = performance.now();
  var charms = [];
  var hinted = false, lastMrrpT = 0, lastSighT = 0, purrDriftAt = 0;
  var heartNextT = 0, zNextT = 0, zIdx = 0, warm = 0;
  var angryEff = null;
  var bellyDefendUntil = 0, tailFlickUntil = 0, interactFired = false;
  var shyUntil = 0;
  var proactiveCooldown = 0;
  var tailIdleNext = 0;

  // === 光点 ===
  var DOT_GRAB_R = 6;
  var DOT_ZONE = { x0: 26, x1: 54, y0: 4, y1: 32 };
  var dot = { state: 'hidden', x: 0, y: 0, born: 0, life: 0, vx: 0, vy: 0 };
  var dotNextSpawn = 0;
  var dotGrabbbed = false;

  // === 扑击 ===
  var POUNCE_ALERT_MS = 250;
  var POUNCE_MS = 350;
  var CATCH_R = 8;
  var POUNCE_CD = 30000;
  var pounce = { state: 'idle', born: 0, catchX: 0, catchY: 0, catch: false };
  var pounceCooldown = 0;
  var grrCv = document.getElementById('grrBubble'), grrCtx = grrCv.getContext('2d'), lastAngerVis = false;

  // === 记忆模块 ===
  var MEMORY_KEY = 'catmem_pixelcat';
  var memory = { visits: 0, petSec: 0, leftAnnoyed: false, lastVisitAt: 0 };
  var level = 0;
  var sessionPetStart = performance.now();
  var sessionPetSec = 0;
  function loadMemory() {
    try {
      var raw = localStorage.getItem(MEMORY_KEY);
      if (raw) {
        var m = JSON.parse(raw);
        memory.visits = m.visits || 0;
        memory.petSec = m.petSec || 0;
        memory.leftAnnoyed = !!m.leftAnnoyed;
        memory.lastVisitAt = m.lastVisitAt || 0;
      }
    } catch (e) {}
    memory.visits++;
    memory.lastVisitAt = Date.now();
    level = memory.visits === 1 ? 0 : (memory.visits === 2 ? 1 : 2);
  }
  function saveMemory() {
    try { localStorage.setItem(MEMORY_KEY, JSON.stringify(memory)); } catch (e) {}
  }
  function flushPetSec() {
    if (holding && !angry && !asleep) {
      var now = performance.now();
      sessionPetSec = (now - sessionPetStart) / 1000;
      memory.petSec += sessionPetSec;
      sessionPetStart = now;
      saveMemory();
    }
  }
  loadMemory();

  // 首次问候 & 躲闪初始化
  var shyTimeout = null;
  var greeted = false;
  function doGreeting() {
    if (greeted) return;
    greeted = true;
    // 立即播放静音音符，保持 AudioContext 活跃（浏览器策略）
    if (AC) {
      var osc = AC.createOscillator();
      var gn = AC.createGain();
      gn.gain.value = 0;
      osc.connect(gn); gn.connect(AC.destination);
      osc.start(); osc.stop(AC.currentTime + 0.01);
    }
    if (level === 0) {
      setTimeout(function () { maoSound(performance.now()); }, 1200);
    }
    if (memory.leftAnnoyed) {
      shyUntil = performance.now() + 7000;
      shyTimeout = setTimeout(function () {
        maoSound(performance.now());
        memory.leftAnnoyed = false;
        saveMemory();
      }, 7000);
    }
  }
  function drawGrr() {
    grrCv.width = 40; grrCv.height = 26;
    var g = grrCtx, O = '#8a5a3a', F = '#fffdf8';
    g.clearRect(0, 0, 40, 26);
    g.fillStyle = F;
    g.fillRect(3, 6, 34, 17);
    g.fillStyle = O;
    g.fillRect(7, 3, 26, 1); g.fillRect(4, 4, 32, 1); g.fillRect(3, 5, 34, 1);
    g.fillRect(2, 6, 1, 17); g.fillRect(37, 6, 1, 17);
    g.fillRect(3, 23, 34, 1); g.fillRect(4, 24, 32, 1); g.fillRect(7, 25, 26, 1);
    g.font = 'bold 17px "Microsoft YaHei","PingFang SC",sans-serif';
    g.textAlign = 'center'; g.textBaseline = 'middle';
    g.fillText('咕', 20, 14.5);
  }
  drawGrr();
  var HEAD = { x0: 16, x1: 64, y0: 2, y1: 34 };
  var BELLY = { x0: 28, x1: 52, y0: 34, y1: 45 };
  var TAIL = { x0: 58, x1: 66, y0: 42, y1: 50 };
  function inZone(z, gx, gy) {
    return gx >= z.x0 && gx <= z.x1 && gy >= z.y0 && gy <= z.y1;
  }
  function gazeLean() {
    if (asleep || angry) return 0;
    var t = (dot.state !== 'hidden' && !holding) ? dot.x : fx;
    var now = performance.now();
    if (now < shyUntil) return clamp((40 - t) / 40, -1, 1) * 2;
    if (dot.state !== 'hidden' && !holding) return clamp((t - 40) / 40, -1, 1) * 5;
    var amp = level >= 1 ? 2.6 : 2;
    return clamp((t - 40) / 40, -1, 1) * amp;
  }

  function resize() {
    dpr = window.devicePixelRatio || 1;
    cw = window.innerWidth; ch = window.innerHeight;
    cv.width = Math.round(cw * dpr); cv.height = Math.round(ch * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    S = Math.max(2, Math.floor(Math.min(cw * 0.92 / CAT.W, ch * 0.78 / CAT.H)));
    ox = Math.round((cw - CAT.W * S) / 2);
    oy = Math.round((ch - CAT.H * S) / 2 + ch * 0.02);
    var gs = Math.max(2, Math.round(S * 0.5));
    grrCv.style.width = (40 * gs) + 'px';
    grrCv.style.height = (26 * gs) + 'px';
  }
  window.addEventListener('resize', resize);

  var effects = [];
  function spawnFx(name, gx, gy, o) {
    o = o || {};
    if (!o.sticky) {
      var n = 0, nz = 0;
      for (var i = 0; i < effects.length; i++) {
        if (effects[i].sticky) continue;
        if (effects[i].id === 'z') nz++; else n++;
      }
      if (name === 'z' ? nz >= 3 : n >= 2) return null;
    }
    var e = {
      id: name, sp: SPRITES[name], color: SPRITES[name].color,
      x: gx, y: gy, born: performance.now(),
      life: o.life || 1500, size: o.size || 1,
      vy: o.vy === undefined ? -3.2 : o.vy, vx: o.vx || 0,
      wob: o.wob === undefined ? 1.2 : o.wob, wobSpd: o.wobSpd || 0.006,
      sticky: !!o.sticky
    };
    effects.push(e);
    return e;
  }
  function killFx(e) {
    if (!e) return;
    e.sticky = false;
    e.life = (performance.now() - e.born) + 250;
  }
  function updateFx(tNow, dt) {
    for (var i = effects.length - 1; i >= 0; i--) {
      var e = effects[i];
      if (!e.sticky) {
        e.y += e.vy * dt / 1000;
        e.x += e.vx * dt / 1000;
        if (tNow - e.born > e.life) effects.splice(i, 1);
      }
    }
  }
  function drawSprite(sp, px, py, s, color, alpha) {
    if (s < 1) s = Math.max(1, s);
    ctx.globalAlpha = alpha;
    ctx.fillStyle = color;
    for (var r = 0; r < sp.rows.length; r++) {
      var row = sp.rows[r];
      for (var c = 0; c < row.length; c++) {
        if (row.charAt(c) === 'X') ctx.fillRect(px + c * s, py + r * s, Math.ceil(s), Math.ceil(s));
      }
    }
    if (sp.glint && alpha > 0.5) {
      ctx.fillStyle = 'rgba(255,255,255,0.85)';
      ctx.fillRect(px + sp.glint[0] * s, py + sp.glint[1] * s, Math.ceil(s), Math.ceil(s));
    }
    ctx.globalAlpha = 1;
  }
  function drawFx(tNow) {
    for (var i = 0; i < effects.length; i++) {
      var e = effects[i];
      var age = tNow - e.born;
      var a = Math.min(1, age / 150);
      if (!e.sticky) a *= Math.max(0, Math.min(1, (e.life - age) / 300));
      var wox = e.sticky ? 0 : Math.sin(tNow * e.wobSpd + e.born) * e.wob;
      var pulse = e.id === 'anger' ? 1 + 0.1 * Math.sin(tNow / 90) : 1;
      drawSprite(e.sp, ox + (e.x + wox) * S, oy + e.y * S, S * e.size * pulse, e.color, a);
    }
  }

  // === 光点逻辑 ===
  function spawnDot() {
    if (dot.state !== 'hidden' || asleep || angry) return;
    var x, y;
    do {
      x = 10 + Math.random() * 60;
      y = 5 + Math.random() * 45;
    } while (x > DOT_ZONE.x0 - 5 && x < DOT_ZONE.x1 + 5 && y > DOT_ZONE.y0 - 5 && y < DOT_ZONE.y1 + 5);
    dot.state = 'drift';
    dot.x = x; dot.y = y;
    dot.born = performance.now();
    dot.life = 20000 + Math.random() * 15000;
    dot.vx = (Math.random() - 0.5) * 1.5;
    dot.vy = (Math.random() - 0.5) * 1;
  }
  function updateDot(tNow, dt) {
    if (dot.state === 'hidden') {
      if (tNow > dotNextSpawn && !asleep && !angry) spawnDot();
      return;
    }
    if (dot.state === 'drift') {
      dot.x += dot.vx * dt / 1000;
      dot.y += dot.vy * dt / 1000;
      if (Math.random() < 0.02) {
        dot.vx += (Math.random() - 0.5) * 2;
        dot.vy += (Math.random() - 0.5) * 1.5;
        dot.vx = clamp(dot.vx, -2, 2);
        dot.vy = clamp(dot.vy, -1.5, 1.5);
      }
      if (dot.x < 2) { dot.x = 2; dot.vx = Math.abs(dot.vx); }
      if (dot.x > 78) { dot.x = 78; dot.vx = -Math.abs(dot.vx); }
      if (dot.y < 2) { dot.y = 2; dot.vy = Math.abs(dot.vy); }
      if (dot.y > 55) { dot.y = 55; dot.vy = -Math.abs(dot.vy); }
      if (tNow - dot.born > dot.life) {
        dot.state = 'hidden';
        dotNextSpawn = tNow + 15000 + Math.random() * 15000;
      }
    }
  }
  function drawDot(tNow) {
    if (dot.state === 'hidden') return;
    var age = tNow - dot.born;
    var fadeIn = Math.min(1, age / 400);
    var remain = dot.life - age;
    var fadeOut = Math.min(1, remain / 600);
    var a = fadeIn * fadeOut;
    var wingFrame = Math.floor(tNow / 150) % 2;
    var sp = wingFrame === 0 ? SPRITES.dot : SPRITES.dot2;
    var bob = Math.sin(tNow / 300) * 1.5;
    drawSprite(sp, ox + dot.x * S, oy + (dot.y + bob) * S, S * 1.4, sp.color, a);
  }
  function dotInZone() {
    return dot.state !== 'hidden' && dot.x >= DOT_ZONE.x0 && dot.x <= DOT_ZONE.x1 && dot.y >= DOT_ZONE.y0 && dot.y <= DOT_ZONE.y1;
  }

  var AC = null, purrMaster = null, lfo = null, noiseBuf = null;
  function makeNoise(ac) {
    var len = ac.sampleRate * 2;
    var buf = ac.createBuffer(1, len, ac.sampleRate);
    var d = buf.getChannelData(0);
    var last = 0;
    for (var i = 0; i < len; i++) {
      var white = Math.random() * 2 - 1;
      last = (last + 0.02 * white) / 1.02;
      d[i] = last * 3.5;
    }
    return buf;
  }
  function ensureAudio() {
    if (AC) { if (AC.state === 'suspended') AC.resume(); return; }
    try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return; }
    noiseBuf = makeNoise(AC);
    // 呼噜：纯合成（低频锯齿 + 低通 + 25Hz 韵律），不用随机噪声（噪声=风声/沸腾声）
    var purr = AC.createOscillator();
    purr.type = 'sawtooth'; purr.frequency.value = 55;
    var lp = AC.createBiquadFilter();
    lp.type = 'lowpass'; lp.frequency.value = 200; lp.Q.value = 0.9;
    var am = AC.createGain(); am.gain.value = 0.5;
    lfo = AC.createOscillator(); lfo.frequency.value = 25;
    var lfoG = AC.createGain(); lfoG.gain.value = 0.35;
    lfo.connect(lfoG); lfoG.connect(am.gain);
    purrMaster = AC.createGain(); purrMaster.gain.value = 0;
    purr.connect(lp); lp.connect(am); am.connect(purrMaster); purrMaster.connect(AC.destination);
    purr.start(); lfo.start();
  }
  function mrrpSound(now, o) {
    o = o || {};
    if (!AC) return;
    if (now - lastMrrpT < (o.throttle || 1200)) return;
    lastMrrpT = now;
    var base = o.base || 540, end = o.end || 290, vol = o.vol || 0.09;
    var count = o.count || 2, gap = o.gap || 0.14, dur = o.dur || 0.11;
    var t0 = AC.currentTime;
    for (var i = 0; i < count; i++) {
      var dt = i * gap;
      var osc = AC.createOscillator(), gn = AC.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(base * (0.92 + Math.random() * 0.16), t0 + dt);
      osc.frequency.exponentialRampToValueAtTime(end, t0 + dt + dur * 0.8);
      gn.gain.setValueAtTime(0.0001, t0 + dt);
      gn.gain.exponentialRampToValueAtTime(vol, t0 + dt + 0.02);
      gn.gain.exponentialRampToValueAtTime(0.0001, t0 + dt + dur);
      osc.connect(gn); gn.connect(AC.destination);
      osc.start(t0 + dt); osc.stop(t0 + dt + dur + 0.03);
    }
  }
  function maoSound(now) {
    mrrpSound(now, { base: 760, end: 430, vol: 0.12, count: 1, dur: 0.22, throttle: 400 });
  }
  function sighSound(now) {
    if (!AC || now - lastSighT < 4000) return;
    lastSighT = now;
    var src = AC.createBufferSource();
    src.buffer = noiseBuf; src.loop = true;
    var lp = AC.createBiquadFilter();
    lp.type = 'lowpass'; lp.frequency.value = 600;
    var gn = AC.createGain();
    var t0 = AC.currentTime;
    gn.gain.setValueAtTime(0.0001, t0);
    gn.gain.exponentialRampToValueAtTime(0.09, t0 + 0.35);
    gn.gain.exponentialRampToValueAtTime(0.0001, t0 + 1.15);
    src.connect(lp); lp.connect(gn); gn.connect(AC.destination);
    src.start(t0); src.stop(t0 + 1.2);
  }

  function toGrid(e) {
    var r = cv.getBoundingClientRect();
    return { gx: (e.clientX - r.left - ox) / S, gy: (e.clientY - r.top - oy) / S };
  }
  function inHead(gx, gy) {
    return gx >= HEAD.x0 && gx <= HEAD.x1 && gy >= HEAD.y0 && gy <= HEAD.y1;
  }

  cv.addEventListener('pointerdown', function (e) {
    ensureAudio();
    doGreeting();
    if (window.STUDIO) window.STUDIO.start();
    var now = performance.now();
    lastTouchT = now;
    if (asleep) {
      asleep = false;
      startleUntil = now + 600;
      mrrpSound(now, { base: 840, end: 520, vol: 0.11, count: 1, dur: 0.15, throttle: 200 });
      spawnFx('bang', 40 + pose.lean, 3, { life: 700, vy: -1.2, wob: 0.5 });
    }
    if (ptrId !== null) return;
    ptrId = e.pointerId;
    try { cv.setPointerCapture(ptrId); } catch (err) {}
    var p = toGrid(e);
    fx = p.gx; fy = p.gy; lastPX = e.clientX; lastPY = e.clientY;
    // 光点抓取
    if (dot.state !== 'hidden' && !dotGrabbbed) {
      var ddx = p.gx - dot.x, ddy = p.gy - dot.y;
      if (Math.sqrt(ddx * ddx + ddy * ddy) < DOT_GRAB_R) {
        dotGrabbbed = true;
        holding = false;
        e.preventDefault();
        return;
      }
    }
    holding = inHead(fx, fy);
    if (!holding && !asleep && !angry) {
      if (inZone(BELLY, fx, fy)) {
        bellyDefendUntil = now + 700;
        annoy = Math.min(1, annoy + 0.15);
        mrrpSound(now, { base: 620, end: 380, vol: 0.1, count: 1, dur: 0.18, throttle: 400 });
        spawnFx('anger', fx, fy - 5, { life: 700, vy: -1, wob: 0.6 });
      } else if (inZone(TAIL, fx, fy)) {
        tailFlickUntil = now + 500;
        annoy = Math.min(1, annoy + 0.1);
        mrrpSound(now, { base: 460, end: 300, vol: 0.07, count: 1, dur: 0.1, throttle: 400 });
        spawnFx('bang', fx, fy - 5, { life: 500, vy: -1, wob: 0.5 });
      }
    }
    if (holding && !angry) mrrpSound(now, {});
    e.preventDefault();
  });
  cv.addEventListener('pointermove', function (e) {
    var p = toGrid(e);
    fx = p.gx; fy = p.gy;
    if (dotGrabbbed && dot.state !== 'hidden') {
      dot.x = p.gx; dot.y = p.gy;
      dot.vx = 0; dot.vy = 0;
    }
    if (ptrId === e.pointerId && holding && !angry) {
      var dg = (Math.abs(e.clientX - lastPX) + Math.abs(e.clientY - lastPY)) / S;
      gAcc += dg;
      dyAcc += (e.clientY - lastPY) / S;
      lastTouchT = performance.now();
    }
    lastPX = e.clientX; lastPY = e.clientY;
    if (ptrId === null) cv.style.cursor = inHead(fx, fy) ? 'pointer' : 'default';
  });
  function release(e) {
    if (ptrId !== e.pointerId) return;
    if (dotGrabbbed) {
      dotGrabbbed = false;
      dot.vx = (Math.random() - 0.5) * 1.5;
      dot.vy = (Math.random() - 0.5) * 1;
    }
    if (E >= 0.7 && !angry) {
      var now = performance.now();
      charms.push({ at: now + 550, fn: function () { blinkUntil = performance.now() + 150; } });
      charms.push({ at: now + 980, fn: function () { twitchUntil = performance.now() + 170; } });
    }
    ptrId = null; holding = false; gAcc = 0; dyAcc = 0;
  }
  cv.addEventListener('pointerup', release);
  cv.addEventListener('pointercancel', release);

  document.addEventListener('visibilitychange', function () {
    if (document.hidden) {
      flushPetSec();
      if (annoy > 0.5) memory.leftAnnoyed = true;
      saveMemory();
      E = 0; annoy = 0; holding = false; ptrId = null; angry = false;
      effects.length = 0; angryEff = null;
      dot.state = 'hidden'; dotGrabbbed = false;
      pounce.state = 'idle';
      if (purrMaster) purrMaster.gain.value = 0;
    }
  });
  window.addEventListener('pagehide', function () {
    flushPetSec();
    if (annoy > 0.5) memory.leftAnnoyed = true;
    saveMemory();
  });

  function mix3(a, b, k) {
    return [Math.round(a[0] + (b[0] - a[0]) * k), Math.round(a[1] + (b[1] - a[1]) * k), Math.round(a[2] + (b[2] - a[2]) * k)];
  }

  function render(tNow) {
    ctx.clearRect(0, 0, cw, ch);
    var cxx = ox + CAT.W / 2 * S;
    var cyc = oy + 24 * S;
    var wv = clamp(warm, -1, 1);
    if (wv > 0.02) {
      var g = ctx.createRadialGradient(cxx, cyc, S * 6, cxx, cyc, S * 58);
      g.addColorStop(0, 'rgba(255,186,120,' + (0.16 * wv).toFixed(3) + ')');
      g.addColorStop(1, 'rgba(255,186,120,0)');
      ctx.fillStyle = g; ctx.fillRect(0, 0, cw, ch);
    } else if (wv < -0.02) {
      var g2 = ctx.createRadialGradient(cxx, cyc, S * 6, cxx, cyc, S * 58);
      g2.addColorStop(0, 'rgba(120,150,190,' + (0.15 * -wv).toFixed(3) + ')');
      g2.addColorStop(1, 'rgba(120,150,190,0)');
      ctx.fillStyle = g2; ctx.fillRect(0, 0, cw, ch);
    }
    var NEUTRAL = [248, 241, 229], WARMC = [252, 232, 206], COOLC = [235, 240, 247];
    var bg = wv > 0 ? mix3(NEUTRAL, WARMC, wv) : mix3(NEUTRAL, COOLC, -wv);
    document.body.style.backgroundColor = 'rgb(' + bg[0] + ',' + bg[1] + ',' + bg[2] + ')';

    var bp = asleep ? 5200 : 3400;
    var bAmp = asleep ? 1.6 : 1;
    var breath = Math.sin(tNow / bp * Math.PI * 2);
    var cby = oy + (CAT.H - 3) * S;
    ctx.fillStyle = 'rgba(150, 110, 80, 0.13)';
    ctx.beginPath();
    ctx.ellipse(cxx, cby + 2, 24 * S * (1 - 0.01 * breath * bAmp), 4.2 * S, 0, 0, Math.PI * 2);
    ctx.fill();

    var bx = 1 + 0.006 * breath * bAmp, by = 1 - 0.009 * breath * bAmp;
    ctx.save();
    ctx.translate(cxx, cby);
    ctx.scale(bx, by);
    ctx.translate(-cxx, -cby);

    var grid = CAT.buildCat(SPEC, {
      earPress: pose.ear, eyeSquint: pose.squint,
      tailSway: pose.sway, headLean: pose.lean,
      angry: (tNow < bellyDefendUntil || angryEff !== null) ? 1 : 0
    });
    for (var y = 0; y < CAT.H; y++) for (var x = 0; x < CAT.W; x++) {
      if (grid[y][x] === '.') continue;
      ctx.fillStyle = CAT.pixelColor(grid, x, y, PAL);
      ctx.fillRect(ox + x * S, oy + y * S, S, S);
    }
    ctx.restore();

    drawFx(tNow);
    drawDot(tNow);
  }

  var tPrev = performance.now();
  var wasHolding = false;
  function loop(tNow) {
    var dt = Math.min(50, tNow - tPrev);
    tPrev = tNow;

    // 会话抚摸计时
    if (holding && !angry && !asleep) {
      if (!wasHolding) sessionPetStart = tNow;
    } else if (wasHolding) {
      sessionPetSec = (tNow - sessionPetStart) / 1000;
    }
    wasHolding = holding && !angry && !asleep;

    if (gAcc >= 2.2) {
      if (holding && !angry) {
        if (dyAcc > 0.5) {
          E = Math.min(1, E + 0.045);
          annoy = Math.max(0, annoy - 0.06);
        } else if (dyAcc < -0.5) {
          E = Math.min(1, E + 0.015);
          annoy = Math.min(1, annoy + 0.05);
          if (Math.random() < 0.35) twitchUntil = tNow + 150;
        } else {
          E = Math.min(1, E + 0.025);
        }
        if (E > 0.8 && gAcc > 6) annoy = Math.min(1, annoy + 0.04);
      }
      gAcc = 0; dyAcc = 0;
    }

    if (holding) {
      if (E > 0.45) E = Math.max(0.45, E - dt * 0.00012);
    } else {
      E = Math.max(0, E - dt * 0.0004);
    }
    if (!holding) annoy = Math.max(0, annoy - dt * 0.00025);

    if (!angry && annoy > 0.85 && !asleep) {
      angry = true;
      angryUntil = tNow + 1500;
      maoSound(tNow);
      E = E * 0.4;
    }
    if (angry && tNow > angryUntil) {
      angry = false;
      annoy = 0.2;
      blinkUntil = tNow + 180;
    }

    if (!asleep && !angry && tNow > blinkAt) {
      if (pose.squint < 0.3) blinkUntil = tNow + 140;
      blinkAt = tNow + 2400 + Math.random() * 3600;
    }
    var blink = tNow < blinkUntil;
    if (!asleep && !angry && tNow > twitchAt) {
      if (E < 0.15) twitchUntil = tNow + 170;
      twitchAt = tNow + 6000 + Math.random() * 8000;
    }
    var twitch = tNow < twitchUntil;

    if (holding && !angry && !asleep && E > 0.55 && tNow > microNextT) {
      microNextT = tNow + 1400 + Math.random() * 2000;
      var r = Math.random();
      if (r < 0.45) {
        hbUntil = tNow + 340;
        hbDir = (fx - 40) >= 0 ? 1 : -1;
        mrrpSound(tNow, { base: 500, end: 330, vol: 0.07, count: 1, dur: 0.1, throttle: 300 });
      } else if (r < 0.7) {
        mrrpSound(tNow, { vol: 0.08, throttle: 300 });
      } else if (r < 0.9) {
        twitchUntil = tNow + 160;
      } else {
        purrBumpUntil = tNow + 700;
      }
    }

    // 主动靠近（level 2）：安静瞬间蹭一下
    if (level >= 2 && !holding && !angry && !asleep && tNow > proactiveCooldown) {
      if (sessionPetSec > 20 && tNow - lastTouchT > 3000) {
        var dir = (fx - 40) >= 0 ? 1 : -1;
        hbUntil = tNow + 600;
        hbDir = dir;
        mrrpSound(tNow, { vol: 0.06, count: 1, dur: 0.08, throttle: 300 });
        proactiveCooldown = tNow + 60000;
      }
    }

    if (holding && E > 0.9 && !angry && !asleep) {
      goodT += dt;
      if (goodT > 1200 && !sighed) {
        sighed = true;
        sighSound(tNow);
        blinkUntil = tNow + 480;
        hbUntil = tNow + 400;
        hbDir = (fx - 40) >= 0 ? 1 : -1;
        spawnFx('note', 40 + pose.lean + (fx - 40) * 0.3, 6, { life: 1600, vy: -2.6, vx: 0.4 });
      }
    } else if (E < 0.5) {
      goodT = 0; sighed = false;
    }

    if (!holding && !asleep && E < 0.05 && annoy < 0.1 && tNow - lastTouchT > 25000) {
      asleep = true;
    }

    if (!angry && !asleep) {
      if (E > 0.55 && prevE <= 0.55) {
        spawnFx('heart', 40 + pose.lean - 6 - Math.random() * 5, 7, { life: 1500 });
        if (window.STUDIO && !interactFired) { interactFired = true; window.STUDIO.interact({ kind: 'pet' }); }
      }
      if (E > 0.75 && tNow > heartNextT) {
        spawnFx('heart', 40 + pose.lean + (Math.random() * 12 - 6), 7, { life: 1500 });
        heartNextT = tNow + 1900 + Math.random() * 1700;
      }
    }
    if (annoy > 0.5 && !angryEff && !asleep) {
      angryEff = spawnFx('anger', 40 + pose.lean + 9, 2, { sticky: true, life: 1e9, vy: 0, wob: 0.4, wobSpd: 0.004, size: 0.8, max: 99 });
    }
    if (angryEff) {
      if (annoy < 0.32 || asleep) { killFx(angryEff); angryEff = null; }
      else { angryEff.x = 40 + pose.lean + 9; angryEff.size = angry ? 1.05 : 0.8; }
    }
    if (asleep && tNow > zNextT) {
      zIdx++;
      spawnFx('z', 40 + pose.lean + 7, 8, { life: 2300, size: 0.55 + 0.18 * (zIdx % 3), vx: 0.7, vy: -2.2, max: 3 });
      zNextT = tNow + 950 + Math.random() * 500;
    }

    var wTarget;
    if (angry) wTarget = -0.8;
    else if (annoy > 0.45) wTarget = -annoy * 0.8;
    else if (asleep) wTarget = 0.08;
    else wTarget = E * 0.9;
    warm += (wTarget - warm) * (1 - Math.exp(-dt / 700));
    prevE = E;

    for (var ci = charms.length - 1; ci >= 0; ci--) {
      if (tNow >= charms[ci].at) { charms[ci].fn(); charms.splice(ci, 1); }
    }

    // === 扑击状态机 ===
    if (pounce.state === 'idle' && dotGrabbbed && dot.state !== 'hidden' && dotInZone() && tNow > pounceCooldown) {
      pounce.state = 'alert';
      pounce.born = tNow;
    }
    if (pounce.state === 'alert') {
      if (!dotGrabbbed || !dotInZone()) {
        pounce.state = 'idle'; // 拖出去了，取消
      } else if (tNow - pounce.born > POUNCE_ALERT_MS) {
        pounce.state = 'pounce';
        pounce.born = tNow;
        pounce.catchX = dot.x;
        pounce.catchY = dot.y;
        var ddx = dot.x - 40, ddy = dot.y - 18;
        pounce.catch = Math.sqrt(ddx * ddx + ddy * ddy) < CATCH_R;
        spawnFx('dust', 40 + (pounce.catchX > 40 ? 5 : -5), 40, { life: 500, vy: -2, vx: pounce.catchX > 40 ? 1 : -1, size: 0.8 });
        mrrpSound(tNow, { base: 800, end: 400, vol: 0.1, count: 1, dur: 0.08, throttle: 200 });
      }
    }
    if (pounce.state === 'pounce') {
      if (tNow - pounce.born > POUNCE_MS) {
        if (pounce.catch) {
          dot.state = 'hidden';
          dotGrabbbed = false;
          dotNextSpawn = tNow + 30000;
          E = Math.min(1, E + 0.05);
          sqT = 1;
        } else {
          dot.vx = (Math.random() > 0.5 ? 1 : -1) * 4;
          dot.vy = (Math.random() - 0.5) * 3;
          dotGrabbbed = false;
        }
        pounce.state = 'recover';
        pounce.born = tNow;
        pounceCooldown = tNow + POUNCE_CD;
      }
    }
    if (pounce.state === 'recover') {
      if (tNow - pounce.born > 800) {
        pounce.state = 'idle';
      }
    }

    var earT, sqT, swayT, leanT;
    var showAnger = (tNow < bellyDefendUntil || angryEff !== null);
    if (showAnger !== lastAngerVis) {
      lastAngerVis = showAnger;
      grrCv.style.opacity = showAnger ? '1' : '0';
    }
    grrCv.style.left = (ox + (40 + 20 + pose.lean) * S + 6) + 'px';
    grrCv.style.top = (oy + 4 * S) + 'px';
    if (angry) {
      earT = 0.95; sqT = 0;
      swayT = Math.sin(tNow / 1000 * 9) * 0.9;
      leanT = -clamp((fx - 40) / 26, -1, 1) * 3.2;
    } else if (asleep) {
      earT = 0.3; sqT = 1; swayT = 0; leanT = 0.6;
    } else {
      earT = holding ? 0.3 + 0.6 * E : 0;
      if (tNow < shyUntil) earT = Math.max(earT, 0.5);
      sqT = clamp((E - 0.25) / 0.45, 0, 1);
      if (tNow < bellyDefendUntil) {
        leanT = clamp((fx - 40) / 26, -1, 1) * -3;
        earT = Math.max(earT, 0.6);
        sqT = 0;
        swayT = 0;
      } else if (tNow < tailFlickUntil) {
        swayT = Math.sin(tNow / 60) * 0.8;
        leanT = 0;
      } else {
        if (annoy > 0.45) swayT = Math.sin(tNow / 1000 * 9) * 0.9;
        else if (E > 0.3) swayT = Math.sin(tNow / 1000 * 2.6) * E;
        else if (tNow < tailIdleNext) {
          var prog = (tNow - (tailIdleNext - 1200)) / 1200;
          swayT = Math.sin(prog * Math.PI * 3) * 0.3 * (1 - prog);
        } else {
          swayT = 0;
          if (tNow > tailIdleNext) tailIdleNext = tNow + 5000 + Math.random() * 3000;
        }
        leanT = holding ? clamp((fx - 40) / 26, -1, 1) * 1.8 * Math.min(1, E + 0.4) : gazeLean();
        if (tNow < hbUntil) leanT += hbDir * 2.4;
      }
    }
    // 扑击姿态覆盖
    if (pounce.state === 'alert') {
      earT = 0; sqT = 0; swayT = 0;
      leanT = clamp((dot.x - 40) / 26, -1, 1) * 2;
    } else if (pounce.state === 'pounce') {
      var pDir = (pounce.catchX > 40) ? 1 : -1;
      earT = 0.9; sqT = 0; swayT = 0;
      leanT = pDir * 4;
    }
    if (twitch && !angry) earT = Math.max(earT, 0.5);
    if (blink && !angry) sqT = 1;
    if (tNow < startleUntil) { sqT = 0; earT = 0; }
    leanT = clamp(leanT, -4, 4);

    var kFast = 1 - Math.exp(-dt / 70);
    var kSlow = 1 - Math.exp(-dt / 130);
    pose.ear += (earT - pose.ear) * kFast;
    pose.squint += (sqT - pose.squint) * kFast;
    pose.sway += (swayT - pose.sway) * kFast;
    pose.lean += (leanT - pose.lean) * kSlow;

    if (!hinted && E > 0.3) { hinted = true; hint.style.opacity = '0'; }

    var purrT = (angry || asleep || annoy > 0.55) ? 0 : E * 0.22;
    if (tNow < purrBumpUntil) purrT = Math.min(0.5, purrT + 0.1);
    if (purrMaster && AC) purrMaster.gain.setTargetAtTime(purrT, AC.currentTime, 0.09);
    if (lfo && AC && tNow > purrDriftAt) {
      lfo.frequency.setTargetAtTime(21 + Math.random() * 7, AC.currentTime, 0.5);
      purrDriftAt = tNow + 2000 + Math.random() * 2500;
    }

    updateDot(tNow, dt);
    updateFx(tNow, dt);
    render(tNow);
    requestAnimationFrame(loop);
  }

  resize();
  requestAnimationFrame(loop);

  // === 调试钩子 ===
  dotNextSpawn = performance.now() + 10000 + Math.random() * 10000;
  window.CATDBG = {
    getMemory: function () { flushPetSec(); return Object.assign({}, memory, { level: level, sessionPetSec: sessionPetSec }); },
    shy: function () { shyUntil = performance.now() + 7000; },
    level: function () { return level; },
    pet: function (s) { sessionPetSec += (s || 10); },
    dot: function () { spawnDot(); },
    pounce: function () { if (dot.state !== 'hidden') { dot.x = 40; dot.y = 18; dotGrabbbed = true; } }
  };

  // === 分享按钮 ===
  var shareBtn = document.getElementById('shareBtn');
  shareBtn.addEventListener('click', function () {
    if (window.STUDIO) window.STUDIO.share({ url: window.location.href });
    var title = '小方糕 · 一只可以摸的像素猫';
    var url = window.location.href;
    if (typeof navigator !== 'undefined' && navigator.share) {
      navigator.share({ title: title, url: url }).catch(function () {});
    } else {
      try { navigator.clipboard.writeText(url); } catch (e) {}
      shareBtn.textContent = '已复制';
      setTimeout(function () { shareBtn.textContent = '分享'; }, 1600);
    }
  });
})();
</script>
</body>
</html>
